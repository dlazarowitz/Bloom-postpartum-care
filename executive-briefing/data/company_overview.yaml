description: >
  TTEC Holdings is a leading global CX technology and services company
  focused on the design, implementation, and delivery of transformative
  solutions for many of the world's most iconic and disruptive brands
  at the intersection of data, AI, and customer experience.

# Segment descriptions
segments:
  ttec_digital:
    name: "TTEC Digital"
    description: >
      Designs, builds, and operates omnichannel contact center technology,
      CRM, AI and analytics solutions. Focuses on cloud-based and on-premises
      customer experience tools.
    key_services:
      - "CX strategy and design consulting"
      - "Cloud contact center implementation (AWS, Genesys, NICE)"
      - "AI and analytics solutions"
      - "CX technology managed services"

  ttec_engage:
    name: "TTEC Engage"
    description: >
      Delivers AI-enabled customer engagement, customer acquisition and growth,
      tech support, back office, and fraud prevention services.
    key_services:
      - "Customer care and support"
      - "Customer acquisition and growth"
      - "Fraud prevention and detection"
      - "Back-office processing"
      - "AI-augmented agent services"

