period: "Q1 2026"
title: "Quarterly Intelligence Briefing — Key Takeaways"

takeaways:
  - heading: "TTEC Exceeded FY2025 Revenue Guidance"
    detail: >
      Full-year revenue of $2.137B exceeded the high end of guidance.
      Adjusted EBITDA grew 5.6% YoY to $214M with margin expansion to 10.0%.
      Free cash flow turned positive at $83M and net debt declined by $68M.

  - heading: "AI Is Accelerating CX Industry Transformation"
    detail: >
      80% of CX organizations are adopting GenAI solutions. TTEC targets
      near 100% AI adoption with current clients by year-end 2026.
      AI agents are beginning to handle Tier 1 support, compressing
      headcount-based revenue models across the industry.

  - heading: "Competitive Landscape Consolidating"
    detail: >
      Major M&A activity continues with Teleperformance/ZP Better Together ($490M),
      Capgemini's discussions with WNS, and ongoing Concentrix/Webhelp integration.
      Scale and AI capabilities are becoming table-stakes for survival.

  - heading: "FY2026 Guidance Reflects Strategic Pivot"
    detail: >
      Revenue guided down 5% ($2.01-2.06B) as TTEC rationalizes underperforming
      contracts, but EBITDA expected to grow 7.6% ($220-240M). The company is
      prioritizing margin quality over top-line growth.

  - heading: "Peer Valuations Under Pressure"
    detail: >
      CX/BPO sector valuations have compressed as investors weigh AI disruption
      risk against the resilience of complex enterprise CX needs. Potential
      opportunity for countercyclical M&A at attractive multiples.
