regulatory_landscape:
  - area: "Data Privacy & Protection"
    developments:
      - "GDPR enforcement continuing to increase fines for data handling violations"
      - "US state-level privacy laws expanding (California, Virginia, Colorado, Connecticut, Utah)"
      - "No comprehensive federal US privacy law yet, but momentum building"
      - "India Digital Personal Data Protection Act implementation underway"
    impact_on_cx: "Increasing compliance costs, data localization requirements, limits on offshore data processing"
    risk_level: "Medium"

  - area: "AI Regulation"
    developments:
      - "EU AI Act effective August 2025 — high-risk AI systems require transparency and human oversight"
      - "US executive order on AI safety — voluntary compliance framework for enterprises"
      - "Growing requirements for AI explainability in customer-facing applications"
    impact_on_cx: "CX providers must ensure AI deployments meet transparency and bias standards"
    risk_level: "Medium-High"

  - area: "Labor & Employment"
    developments:
      - "Philippines PEZA incentives under review — potential impact on BPO tax benefits"
      - "India labor code reforms increasing compliance complexity"
      - "US gig economy regulations affecting flexible CX staffing models"
      - "European Works Council requirements for restructuring/offshoring"
    impact_on_cx: "Compliance costs increasing, workforce flexibility potentially constrained"
    risk_level: "Medium"

  - area: "Trade & Tariffs"
    developments:
      - "US-China trade tensions impacting technology supply chains"
      - "Services outsourcing generally exempt from tariffs, but political risk increasing"
      - "Nearshoring incentives in US and EU supporting domestic/nearshore delivery"
    impact_on_cx: "Accelerating nearshore shift, potential regulatory barriers to offshore"
    risk_level: "Low-Medium"

